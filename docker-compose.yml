version: '3.8'

services:
  # ============================================================================
  # 1. DRIVIO Backend API & Socket Service
  # ============================================================================
  backend:
    build:
      context: ./fleetease-backend
      dockerfile: Dockerfile
    container_name: drivio-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=fleetease
      - JWT_SECRET=drivio-enterprise-jwt-secret-2026-production
      - CORS_ORIGIN=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - drivio-network

  # ============================================================================
  # 2. DRIVIO Frontend (Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./fleetease-web
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=/api/v1
        - REACT_APP_SOCKET_URL=/
    container_name: drivio-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - drivio-network

  # ============================================================================
  # 3. PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: drivio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleetease
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleetease"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drivio-network

networks:
  drivio-network:
    driver: bridge

volumes:
  postgres_data:
