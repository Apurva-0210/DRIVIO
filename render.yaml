services:
  - type: web
    name: drivio-transit-os
    env: node
    plan: starter
    buildCommand: npm --prefix fleetease-backend install && npm --prefix fleetease-web install && npm --prefix fleetease-web run build
    startCommand: node fleetease-backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: drivio-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: drivio-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: drivio-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: drivio-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: drivio-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: drivio-db
    databaseName: fleetease
    user: drivio_admin
